buildscript {
    ext {
        kotlinVersion = '1.2.21'
        springBootVersion = '2.0.1.RELEASE'
    }
    repositories { jcenter() }
    dependencies {
        classpath 'se.transmode.gradle:gradle-docker:1.2'
        classpath("org.springframework.boot:spring-boot-gradle-plugin:${springBootVersion}")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:${kotlinVersion}")
        classpath("org.jetbrains.kotlin:kotlin-allopen:${kotlinVersion}")
    }
}

plugins {
    id "org.springframework.boot" version "2.0.1.RELEASE"
}

apply plugin: 'java'
apply plugin: 'kotlin'
apply plugin: 'kotlin-spring'
apply plugin: 'eclipse'
apply plugin: 'idea'
apply plugin: 'org.springframework.boot'
apply plugin: 'io.spring.dependency-management'
apply plugin: 'war'
apply plugin: 'application'
apply plugin: 'docker'

group = "com.miles"

docker {
    baseImage "ubuntu"
    maintainer 'Guillaume J. Charmes "guillaume@dotcloud.com"'
}

task nginxDocker(type: Docker) {
    applicationName = "nginx"
    runCommand 'echo "deb http://archive.ubuntu.com/ubuntu precise main universe" > /etc/apt/sources.list'
    runCommand "apt-get update"
    runCommand "apt-get install -y inotify-tools nginx apache2 openssh-server"
}

version = '0.0.2-SNAPSHOT'
mainClassName = 'com.miles.twinpeaks.Application'

sourceCompatibility = 1.8
targetCompatibility = 1.8

repositories {
    mavenCentral()
}

task wrapper(type: Wrapper) {
    gradleVersion = '4.9'
}

task buildDocker(type: Docker, dependsOn: build) {
    push = false
    applicationName = rootProject.name
    dockerfile = file('src/main/docker/Dockerfile')

    doFirst {
        //println "Copying and renaming jar"
        // Rename the app jar to "app.jar" so that the Dockerfile does not require renames
        copy {
            from bootWar
            into stageDir
            include "${rootProject.name}-${version}.war"
            rename("${rootProject.name}-${version}.war", "app.jar")
        }
        //println "Copied and renamed jar"
    }

    doLast {
        println "Run the Docker Container"
        println "docker run -ti -p 8080:8080 $project.group/$applicationName:$version"
    }
}

war {
    baseName = 'twinpeaks'
    version =  '0.1.0'
}

compileKotlin {
    //freeCompilerArgs = ["-Xjsr305=strict"]
    kotlinOptions.jvmTarget = "1.8"
}
compileTestKotlin {
    //freeCompilerArgs = ["-Xjsr305=strict"]
    kotlinOptions.jvmTarget = "1.8"
}

dependencies {
    compile('org.codehaus.groovy:groovy')
    compile('com.h2database:h2')
    compile('org.springframework.boot:spring-boot-actuator')
    compile('org.springframework.boot:spring-boot-starter-tomcat')
    compile('org.springframework.boot:spring-boot-starter-data-jpa')
    compile('org.springframework.boot:spring-boot-starter-data-rest')
    compile("org.springframework.boot:spring-boot-starter-thymeleaf")
    compile('org.springframework.boot:spring-boot-starter-security')
    compile('org.springframework.boot:spring-boot-starter-web')
    compile('org.springframework.data:spring-data-elasticsearch')
    compile group: 'org.hibernate', name: 'hibernate-ehcache', version: '5.2.14.Final'
    compile('io.springfox:springfox-swagger2:2.7.0')
    compile('com.alibaba:fastjson:1.2.47')
    //compile('org.liquibase:liquibase-core')
    compile group: 'org.postgresql', name: 'postgresql', version: '9.3-1100-jdbc41'
    compile 'org.yaml:snakeyaml:1.8'
    compile("org.jetbrains.kotlin:kotlin-stdlib-jdk8")
    compile("org.jetbrains.kotlin:kotlin-reflect")
    compile("com.auth0:java-jwt:3.4.0")
    testCompile('org.springframework.boot:spring-boot-starter-test')
    testCompile('org.springframework.security:spring-security-test')
    testCompile('com.jayway.jsonpath:json-path')
    runtime("org.springframework.boot:spring-boot-properties-migrator")
}
